name: Deploy to GitHub Pages

# Publica o aplicativo original (arquivo único, self-contained) no GitHub Pages.
# Não há build: o conteúdo de ./site é servido exatamente como está.
# Requisito: repositório público (plano gratuito) OU GitHub Pro (repo privado).
# Depois que o Pages estiver disponível, publica em
# https://<usuario>.github.io/<repo>/ a cada push nesta branch.

on:
  push:
    branches: [claude/publish-preregistro-dinamico-vhufxh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
